[project]
name = "aerial-archive-explorer"
version = "2.0.1"
description = "Search and download historic USGS aerial photographs by location."
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.3,<13",
    "certifi>=2024.7.4",
    "keyring>=25.6,<27",
]

[project.gui-scripts]
aerial-archive-explorer = "aerial_archive_explorer:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
